<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>MatchEdge Premium</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div>
      <div class="eyebrow">AI FOOTBALL INTELLIGENCE</div>
      <h1>MatchEdge <span>Premium</span></h1>
    </div>
    <div class="live-dot"><i></i> LIVE DATA</div>
  </header>

  <section class="hero card">
    <div>
      <div class="muted">Bugünün analiz merkezi</div>
      <div class="hero-title">Olasılık. Güven. Value.</div>
    </div>
    <button id="refresh" class="icon-btn">↻</button>
  </section>

  <section class="datebar">
    <button id="prev">‹</button>
    <input id="date" type="date">
    <button id="next">›</button>
  </section>

  <nav id="filters" class="chips"></nav>

  <section class="summary-grid">
    <div class="mini card">
      <b id="matchCount">0</b>
      <span>Maç</span>
    </div>
    <div class="mini card">
      <b id="analyzedCount">0</b>
      <span>Analiz</span>
    </div>
    <div class="mini card">
      <b id="bestValue">—</b>
      <span>En iyi EV</span>
    </div>
  </section>

  <section>
    <div class="section-title">
      <h2>Günün Lig Maçları</h2>
      <span id="status">Yükleniyor…</span>
    </div>
    <div id="matches" class="stack"></div>
  </section>
</div>

<div id="sheet" class="sheet hidden">
  <div class="sheet-card">
    <button id="closeSheet" class="close">×</button>
    <div id="analysis"></div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
